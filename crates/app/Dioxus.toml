[application]
name = "LSpace"

[bundle]
identifier = "ai.stibbons.lspace"
publisher = "stibbons-ai"

[ios.plist]
# The Bridge may be a plain-HTTP address on the LAN.
NSLocalNetworkUsageDescription = "Connects to your L-Space Bridge on your network."

[ios.plist.NSAppTransportSecurity]
NSAllowsArbitraryLoads = true

# The iOS 27 SDK refuses to launch apps without a static UIScene manifest. tao (0.37+) vends
# `TaoSceneDelegate`; the launch check only reads Info.plist, so name it here (ADR 0007).
[ios.plist.UIApplicationSceneManifest]
UIApplicationSupportsMultipleScenes = false

[[ios.plist.UIApplicationSceneManifest.UISceneConfigurations.UIWindowSceneSessionRoleApplication]]
UISceneConfigurationName = "Default Configuration"
UISceneDelegateClassName = "TaoSceneDelegate"
