# Throwaway spike for issue #2 (ADR 0007 gate). Not a workspace member.
[package]
name = "ios-audio-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Own workspace root: keeps the spike out of the main workspace and its `unsafe_code = "forbid"` lint.
[workspace]

[dependencies]
dioxus = { version = "=0.8.0-alpha.3", features = ["mobile"] }
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-av-foundation = { version = "0.3.2", features = ["objc2-core-media", "dispatch2"] }
objc2-media-player = "0.3.2"
objc2-avf-audio = "0.3.2"
objc2-core-media = "0.3.2"
