[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
abs = { path = "crates/abs" }
api = { path = "crates/api" }
store = { path = "crates/store" }
store-sqlite = { path = "crates/store-sqlite" }
test-support = { path = "crates/test-support" }

axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
dioxus = { version = "=0.8.0-alpha.3", default-features = false, features = ["fullstack"] }
dirs = "7.0.0"
fluent-bundle = "0.16.0"
getrandom = "0.4.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.11.1"
sys-locale = "0.3.2"
tempfile = "3.27.0"
testcontainers = { version = "0.28.0", features = ["blocking"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unic-langid = "0.9.6"
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
