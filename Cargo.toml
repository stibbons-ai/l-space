[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
abs = { path = "crates/abs" }
api = { path = "crates/api" }
clock = { path = "crates/clock" }
sonos = { path = "crates/sonos" }
sonos-fake = { path = "crates/sonos-fake" }
store = { path = "crates/store" }
store-sqlite = { path = "crates/store-sqlite" }
test-support = { path = "crates/test-support" }

axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dioxus = { version = "=0.8.0-alpha.3", default-features = false }
dirs = "7.0.0"
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
futures = "0.3.34"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
# Only to enable its `zeroize` feature, which `chacha20poly1305`'s doesn't: the per-call MAC state
# is wiped when dropped.
poly1305 = { version = "0.9.1", features = ["zeroize"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
# The App's server function client, built like dioxus-fullstack's own (same reqwest, rustls
# and webpki roots versions as fullstack's); see `crates/app/src/client.rs`.
reqwest-fullstack = { package = "reqwest", version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
roxmltree = "0.21.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
sha2 = { version = "0.11.1", features = ["zeroize"] }
sys-locale = "0.3.2"
tempfile = "3.27.0"
testcontainers = { version = "0.28.0", features = ["blocking"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unic-langid = "0.9.6"
url = "2.5.8"
webpki-roots = "1.0.11"
zeroize = "1.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
