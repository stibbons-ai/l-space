[tools]
# The iOS targets build the App (`crates/app`, which also pins `dx`).
rust = { version = "1.99.1", profile = "minimal", components = ["clippy", "rustfmt"], targets = "aarch64-apple-ios,aarch64-apple-ios-sim" }

# The App (`app`) always builds on its own. Cargo unifies features across the packages it
# builds together: with the Bridge, `api` gets its `server` feature and the App's server
# function calls would run in-process instead of reaching the Bridge over HTTP; and the App's
# `dioxus` features (mobile, ...) would land in the `bridge` binary the App's tests start.

[tasks.build]
description = "Build every crate and target"
run = [
  "cargo build --workspace --exclude app --all-targets --locked",
  "cargo build --package app --all-targets --locked",
]

[tasks.test]
description = "Run every test, including the black-box Bridge tests and the App's flow tests"
run = [
  # Also builds the `bridge` binary the App's tests start.
  "cargo test --workspace --exclude app --all-targets --locked",
  "cargo test --package app --all-targets --locked",
]

[tasks.lint]
description = "Clippy with warnings denied, and rustfmt in check mode"
run = [
  "cargo clippy --workspace --exclude app --all-targets --locked -- -D warnings",
  # The workspace build enables `api/server` (the Bridge needs it); these check the App's side.
  "cargo clippy --package api --all-targets --locked -- -D warnings",
  "cargo clippy --package app --all-targets --locked -- -D warnings",
  "cargo fmt --all --check",
]

[tasks.check]
description = "Everything CI-worthy: build, lint, test"
depends = ["build", "lint", "test"]

[tasks.image]
description = "Build the Clacks image for this machine's platform and smoke-test it"
run = [
  "docker buildx build --load --tag clacks:local .",
  "scripts/smoke-image.sh clacks:local",
]
